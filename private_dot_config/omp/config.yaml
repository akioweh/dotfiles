$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 4
console_title_template: "{{ .Folder }}"
enable_cursor_positioning: true
shell_integration: true
async: true
streaming: 50
# Catppuccin Mocha
palette:
  rosewater: "#f5e0dc"
  flamingo: "#f2cdcd"
  pink: "#f5c2e7"
  mauve: "#cba6f7"
  red: "#f38ba8"
  maroon: "#eba0ac"
  peach: "#fab387"
  yellow: "#f9e2af"
  green: "#a6e3a1"
  teal: "#94e2d5"
  sky: "#89dceb"
  sapphire: "#74c7ec"
  blue: "#89b4fa"
  lavender: "#b4befe"
  text: "#cdd6f4"
  subtext1: "#bac2de"
  subtext0: "#a6adc8"
  overlay2: "#9399b2"
  overlay1: "#7f849c"
  overlay0: "#6c7086"
  surface2: "#585b70"
  surface1: "#45475a"
  surface0: "#313244"
  base: "#1e1e2e"
  mantle: "#181825"
  crust: "#11111b"
blocks:
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: session
        style: plain
        foreground: "p:subtext1"
        template: "{{ .UserName }} "
      - type: shell
        style: plain
        foreground: "p:mauve"
        template: " <p:text></> {{ .Name }} "
      - type: path
        style: plain
        foreground: "p:blue"
        template: "<p:text></>  {{ .Path }} "
        leading_diamond: <p:mauve>~</>
        trailing_diamond: ""
        options:
          folder_icon: /
          folder_separator_icon: "/"
          home_icon: home
          style: agnoster_full
      - type: git
        style: plain
        foreground: "p:mauve"
        template: "<p:text></> <p:text>{{ .UpstreamIcon }}</>{{ .HEAD }} "
        interactive: true
        options:
          branch_icon: " "
          fetch_status: true
          fetch_upstream_icon: true
      - type: project
        style: plain
        powerline_symbol: 
        template: "<p:text></>  {{ .Name }}{{ if .Version }} {{ .Version }}{{ end }} "
        foreground: "p:blue"
  - type: prompt
    alignment: right
    segments:
      - type: status
        style: diamond
        powerline_symbol: 
        template: " {{ if eq .Code 0 }}{{ else }}{{ end }} {{ .Code }} <p:text></> "
        foreground: "p:green"
        foreground_templates:
          - "{{ if gt .Code 0 }}p:red{{ end }}"
        options:
          always_enabled: true
      - type: executiontime
        style: diamond
        foreground: "p:subtext1"
        template: "{{ .FormattedMs }} <p:text></>"
        options:
          style: austin
          threshold: 0
      - type: time
        style: diamond
        foreground: "p:subtext1"
        template: " {{ .CurrentDate | date .Format }} "
        options:
          time_format: Monday <p:text>at</> 3:04 PM
      - type: root
        style: diamond
        template: " "
        options:
          root_icon: " "
      - type: node
        style: diamond
        foreground: "p:subtext1"
        template: " <p:text></> {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} "
  - type: prompt
    alignment: left
    newline: true
    force: false
    segments:
      - type: text
        style: plain
        powerline_symbol: 
        template: "$ "
        foreground: "p:rosewater"
tooltips:
  - type: git
    style: diamond
    tips:
      - git
      - g
    foreground: "p:base"
    background: "p:yellow"
    template: >-
      {{ .HEAD }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed)
      (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}
    leading_diamond: 
    trailing_diamond: 
    options:
      fetch_status: true
      fetch_upstream_icon: true
  - type: aws
    style: plain
    tips:
      - aws
      - terraform
    foreground: "p:peach"
    template: f {{.Profile}}{{if .Region}}@{{.Region}}{{end}}
  - type: az
    style: plain
    tips:
      - az
      - terraform
    foreground: "p:teal"
    template:  {{ .Name }}
tooltips_action: extend
transient_prompt:
  background: transparent
  foreground: "p:rosewater"
  template: "$ "
